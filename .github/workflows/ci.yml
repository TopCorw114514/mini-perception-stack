name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: MSVC x64 build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show the toolchain that the runner provides
        run: |
          cmake --version
          where.exe cl

      - name: Configure
        run: cmake --preset msvc

      - name: Build (Release)
        run: cmake --build --preset msvc-release

      - name: Test (Release)
        run: ctest --preset msvc-test-release
