name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: MSVC x64 build and test
    # Pinned on purpose: the `windows-latest` alias moves to a newer Visual
    # Studio over time, and the `Visual Studio 17 2022` generator below has to
    # match what the image actually ships.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show the toolchain that the runner provides
        # Only informational. `cl.exe` is deliberately not on PATH here: the
        # Visual Studio generator locates the compiler itself, which is the
        # whole reason this project does not need a vcvars environment.
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format value -property displayName

      - name: Configure
        run: cmake --preset msvc

      - name: Build (Release)
        run: cmake --build --preset msvc-release

      - name: Test (Release)
        run: ctest --preset msvc-test-release
